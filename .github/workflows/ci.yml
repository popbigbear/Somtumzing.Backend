name: .NET CI with Unit Tests

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['10.0.x'] # ปรับให้ตรงกับ TargetFramework net10.0 ในโปรเจกต์

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore Dependencies (Cached)
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # หากไม่มีไฟล์ .sln ที่ Root ให้สั่ง restore จากโฟลเดอร์ Test หรือใช้คำสั่ง dotnet restore เฉยๆ ได้เลย
      - name: Restore dependencies
        run: dotnet restore tests/Somtumzing.Backend.Tests/Somtumzing.Backend.Tests.csproj

      - name: Build project
        run: dotnet build tests/Somtumzing.Backend.Tests/Somtumzing.Backend.Tests.csproj --no-restore --configuration Release

      - name: Run unit tests with reports
        run: |
          dotnet test tests/Somtumzing.Backend.Tests/Somtumzing.Backend.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test_results.trx" --logger "junit;LogFileName=test_results.xml"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.dotnet-version }}
          path: '**/TestResults/*.xml'